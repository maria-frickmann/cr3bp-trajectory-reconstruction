[build-system]
requires = ["setuptools>=77.0"]
build-backend = "setuptools.build_meta"

[project]
name = "cr3bp-trajectory-reconstruction"
version = "1.0.0"
description = "Rekonstruktion einer Transfertrajektorie zu einem Halo-Orbit um den Lagrange-Punkt L2: Vergleich von Compressed Sensing und bayesscher linearer Regression"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Maria Frickmann" }]
keywords = ["CR3BP", "Circular Restricted Three-Body Problem", "Halo Orbit", "Compressed Sensing", "Bayesian Linear Regression", "Bayesian Statistics", "Maturaarbeit"]
classifiers = [
    "Intended Audience :: Science/Research",
    "Natural Language :: German",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Astronomy",
    "Topic :: Scientific/Engineering :: Physics",
    "Topic :: Scientific/Engineering :: Mathematics",
]
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "matplotlib>=3.8",
    "cvxpy>=1.4",
    "sympy>=1.12",
    "joblib>=1.3",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["i_Programmierung*"]